openapi: 3.0.0
info:
  title: Warehouse API
  description: API for managing products in a warehouse
  version: 1.0.0

paths:
  /warehouse:
    get:
      summary: List all warehouses units
      responses:
        '200':
          description: A list of warehouse units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Warehouse'
    post:
      summary: Create a new warehouse unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Warehouse'
      responses:
        '201':
          description: Warehouse unit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: An active warehouse already exists for this business unit code, or the location's warehouse-count/capacity limit would be exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /warehouse/{businessUnitCode}:
    get:
      summary: Get the active warehouse unit by business unit code
      parameters:
        - name: businessUnitCode
          in: path
          required: true
          description: Business unit code of the warehouse unit to get
          schema:
            type: string
      responses:
        '200':
          description: Warehouse unit found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '404':
          description: Warehouse unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      summary: Archive the active warehouse unit by business unit code
      parameters:
        - name: businessUnitCode
          in: path
          required: true
          description: Business unit code of the warehouse unit to archive
          schema:
            type: string
      responses:
        '204':
          description: Warehouse unit archived
        '404':
          description: Warehouse unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /warehouse/{businessUnitCode}/replacement:
    post:
      summary: Replace the current active Warehouse
      description: |
        Replaces the current active Warehouse identified by `businessUnitCode` unit by a new Warehouse provided in the request body
        A Warehouse can be replaced by another Warehouse with the same Business Unit Code.
        That means that the previous Warehouse will be archived and the new Warehouse will be created assuming its place.
      parameters:
        - name: businessUnitCode
          in: path
          required: true
          description: Business unit code of the warehouse unit to replace
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Warehouse'
      responses:
        '200':
          description: Warehouse unit replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Warehouse unit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stock/capacity mismatch with the warehouse being replaced, or the location's warehouse-count/capacity limit would be exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    Warehouse:
      type: object
      required:
        - businessUnitCode
        - location
        - capacity
        - stock
      properties:
        businessUnitCode:
          type: string
          minLength: 1
          description: The public, unique identifier of the *active* warehouse. Database row IDs are internal.
          example: "MWH.001"
        location:
          type: string
          minLength: 1
          example: "AMSTERDAM-001"
        capacity:
          type: integer
          minimum: 1
          example: 100
        stock:
          type: integer
          minimum: 0
          example: 50
        createdAt:
          type: string
          format: date-time
          readOnly: true
        archivedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Null while the warehouse is active; set once it has been archived (e.g. replaced).

    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error type.
          example: "CONFLICT"
        message:
          type: string
          description: Human-readable error message.
          example: "An active warehouse already exists for business unit code 'MWH.001'"
        details:
          type: object
          nullable: true
          description: Optional per-field validation details, present for VALIDATION errors.
          additionalProperties:
            type: string
